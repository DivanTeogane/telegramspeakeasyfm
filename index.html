<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SPEAKEASY 20s FM</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --accent: #DEB887;
      --accent-glow: rgba(211, 153, 71, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #4b1b1b 0%, #090b09 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    .player-card, .chat-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .player-card { text-align: center; }

    .vinyl-wrap {
      width: 130px;
      height: 130px;
      margin: 0 auto 16px;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(#111 0, #111 4px, #222 5px, #111 6px);
      box-shadow: 0 0 25px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 8s linear infinite;
      border: 3px solid rgba(255, 255, 255, 0.1);
    }

    .vinyl.playing { animation-play-state: running; }

    .vinyl-label {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #937f53, #DEB887);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 3px solid #09090b;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }

    .status {
      font-size: 12px;
      color: #aaa9a1;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status.live { color: #DEB887; }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .play-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #937453, #DEB887);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .play-btn:active { transform: scale(0.94); }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    input[type="range"] { width: 100%; accent-color: #DEB887; }

    .chat-header {
      font-size: 14px;
      font-weight: 600;
      color: #e7e4e4;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      margin-bottom: 12px;
    }

    .msg {
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-author {
      font-size: 11px;
      font-weight: 600;
      color: #DEB887;
      margin-bottom: 2px;
    }

    .chat-form {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .chat-input:focus { border-color: #585246; }

    .send-btn {
      background: linear-gradient(135deg, #936353, #DEB887);
      border: none;
      border-radius: 14px;
      padding: 0 16px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label">☯</div>
      </div>
    </div>

    <h1>SPEAKEASY FM</h1>
    <div class="status" id="status">Нажми Play для эфира</div>
    
<div data-type="newStreamPlayer" data-publicToken="4f9df394-8cb9-412b-b22f-e341db2c76e0" data-theme="dark" data-color="DEB887" data-channelId="" data-rendered="false" class="cstrEmbed"><a href="https://www.caster.fm">Shoutcast Hosting</a> <a href="https://www.caster.fm">Stream Hosting</a> <a href="https://www.caster.fm">Radio Server Hosting</a></div><script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

  <div class="chat-card">
    <div class="chat-header">
      <span>˙·٠•●Կᥲᴛ ϶ɸᥙρᥲ●•٠·˙</span>
      <span style="font-size: 11px; color: #a1a1aa;" id="userNameLabel">Гость</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <form class="chat-form" id="chatForm">
      <input type="text" class="chat-input" id="chatInput" placeholder="Написать в эфир..." maxlength="200" required />
      <button type="submit" class="send-btn">➤</button>
    </form>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#4b1b1b");
    }

    // Генерация рандомного ника и цвета
    const adj = ["Night", "Wet", "Dry", "Ritzy", "Keen", "Dolled up", "Ossified", "Bum"];
    const nouns = ["Sheik", "Cake-eater", "Drugstore cowboy", "Bootlegger", "Torpedo", "Jellybean", "Card", "Live wire"];
    const colors = ["#800000", "#FFC0CB", "#FFE4E1", "#B0E0E6", "#98FB98", "#EEE8AA", "#BC8F8F"];

    let userName = localStorage.getItem("radio_nick");
    let userColor = localStorage.getItem("radio_color");

    if (!userName) {
      const rAdj = adj[Math.floor(Math.random() * adj.length)];
      const rNoun = nouns[Math.floor(Math.random() * nouns.length)];
      const rNum = Math.floor(100 + Math.random() * 900);
      userName = `${rAdj} ${rNoun} #${rNum}`;
      localStorage.setItem("radio_nick", userName);
    }

    if (!userColor) {
      userColor = colors[Math.floor(Math.random() * colors.length)];
      localStorage.setItem("radio_color", userColor);
    }

    const userLabel = document.getElementById("userNameLabel");
    userLabel.style.cursor = "pointer";
    userLabel.style.color = userColor;
    userLabel.title = "Нажми, чтобы изменить ник";
    userLabel.textContent = `✏️ ${userName}`;

    // Смена ника и цвета по клику
    userLabel.addEventListener("click", () => {
      const newNick = prompt("Введи свой ник для чата (до 20 символов):", userName);
      if (newNick && newNick.trim()) {
        userName = newNick.trim().slice(0, 20);
        userColor = colors[(colors.indexOf(userColor) + 1) % colors.length];
        localStorage.setItem("radio_nick", userName);
        localStorage.setItem("radio_color", userColor);
        userLabel.textContent = `✏️ ${userName}`;
        userLabel.style.color = userColor;
      }
    });

    // Ваша база данных Firebase для чата
    const DB_URL = "https://speafmchat-default-rtdb.europe-west1.firebasedatabase.app";

    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    let lastHtml = "";

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    async function loadMessages() {
      try {
        const res = await fetch(`${DB_URL}/messages.json?orderBy="$key"&limitToLast=30`);
        const data = await res.json();
        if (!data) return;

        const html = Object.values(data).map(m => `
          <div class="msg">
            <div class="msg-author" style="color: ${escapeHtml(m.color || '#DEB887')}">${escapeHtml(m.author || 'Слушатель')}</div>
            <div>${escapeHtml(m.text)}</div>
          </div>
        `).join("");

        if (html !== lastHtml) {
          chatMessages.innerHTML = html;
          chatMessages.scrollTop = chatMessages.scrollHeight;
          lastHtml = html;
        }
      } catch (e) {}
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = "";
      await fetch(`${DB_URL}/messages.json`, {
        method: "POST",
        body: JSON.stringify({ author: userName, color: userColor, text, time: Date.now() })
      });
      loadMessages();
    });

    loadMessages();
    setInterval(loadMessages, 2500);
  </script>
</body>
</html>
