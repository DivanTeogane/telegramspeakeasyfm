<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Онлайн Радио</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #09090b 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 360px;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    /* Виниловая пластинка */
    .vinyl-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(#111 0, #111 4px, #222 5px, #111 6px);
      box-shadow: 0 0 30px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 8s linear infinite;
      animation-play-state: paused;
      border: 3px solid rgba(255, 255, 255, 0.1);
    }

    .vinyl.playing {
      animation-play-state: running;
    }

    .vinyl-label {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 3px solid #09090b;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Эквалайзер */
    .equalizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 20px;
      margin-bottom: 12px;
    }

    .bar {
      width: 4px;
      height: 4px;
      background: #a855f7;
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .equalizer.active .bar {
      animation: eq 0.8s ease-in-out infinite alternate;
    }
    .equalizer.active .bar:nth-child(2) { animation-delay: 0.2s; }
    .equalizer.active .bar:nth-child(3) { animation-delay: 0.4s; }
    .equalizer.active .bar:nth-child(4) { animation-delay: 0.1s; }
    .equalizer.active .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes eq {
      0% { height: 4px; }
      100% { height: 20px; }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .status {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status.live {
      color: #4ade80;
    }

    .play-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      font-size: 28px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.92);
    }

    .volume-wrap {
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #a1a1aa;
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #a855f7;
      cursor: pointer;
    }

    .share-btn {
      margin-top: 24px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #e4e4e7;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .share-btn:active {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label">🎧</div>
      </div>
    </div>

    <div class="equalizer" id="eq">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <h1>NIGHT WAVE FM</h1>
    <div class="status" id="status">Нажми Play для эфира</div>

    <audio id="radioStream" preload="none"></audio>

    <button class="play-btn" id="playBtn">▶</button>

    <div class="volume-wrap">
      <span>🔈</span>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="0.85" />
      <span>🔊</span>
    </div>

    <button class="share-btn" id="shareBtn">📤 Поделиться радио</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#1e1b4b");
    }

    // Тестовый поток (замените на ссылку своего радио, когда создадите)
    const STREAM_URL = "https://radioparadise.com";

    const audio = document.getElementById("radioStream");
    const playBtn = document.getElementById("playBtn");
    const statusEl = document.getElementById("status");
    const volumeEl = document.getElementById("volume");
    const vinyl = document.getElementById("vinyl");
    const eq = document.getElementById("eq");
    const shareBtn = document.getElementById("shareBtn");

    let isPlaying = false;
    audio.volume = volumeEl.value;

    playBtn.addEventListener("click", () => {
      if (!isPlaying) {
        statusEl.textContent = "Подключение...";
        statusEl.classList.remove("live");
        audio.src = STREAM_URL + "?t=" + Date.now();
        audio.play()
          .then(() => {
            isPlaying = true;
            playBtn.textContent = "⏸";
            statusEl.textContent = "● В эфире";
            statusEl.classList.add("live");
            vinyl.classList.add("playing");
            eq.classList.add("active");
            tg?.HapticFeedback?.impactOccurred("medium"); // легкая вибрация на телефоне
          })
          .catch(() => {
            statusEl.textContent = "Ошибка подключения";
          });
      } else {
        audio.pause();
        audio.src = "";
        isPlaying = false;
        playBtn.textContent = "▶";
        statusEl.textContent = "Эфир на паузе";
        statusEl.classList.remove("live");
        vinyl.classList.remove("playing");
        eq.classList.remove("active");
        tg?.HapticFeedback?.impactOccurred("light");
      }
    });

    volumeEl.addEventListener("input", (e) => {
      audio.volume = e.target.value;
    });

    shareBtn.addEventListener("click", () => {
      const shareText = encodeURIComponent("Слушай крутое онлайн-радио прямо в Telegram!");
      const botUrl = encodeURIComponent("https://t.me"); // потом впишете сюда юзернейм бота
      if (tg) {
        tg.openTelegramLink(`https://t.me{botUrl}&text=${shareText}`);
      }
    });
  </script>
</body>
</html>
